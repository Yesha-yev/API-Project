<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroSmart Jember</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

  <nav>
    <button class="nav-btn" onclick="showSection('dashboard')">Dashboard</button>
    <button class="nav-btn" onclick="showSection('recommend')">Rekomendasi</button>
    <button class="nav-btn" onclick="showSection('care')">Panduan</button>
    <button class="nav-btn" onclick="showSection('production')">Produksi</button>
    <button class="nav-btn" onclick="showSection('fertilizer')">Pupuk</button>
    <button class="nav-btn" onclick="showSection('analysis')">Analisis</button>
    <button id="darkToggle">🌙</button>
  </nav>

  <main>
    <section id="dashboard" class="active">
      <div class="landing card">
        <h1>AgroSmart Jember</h1>
        <p>Platform Digital Rekomendasi Tanaman & Manajemen Pertanian</p>
      </div>
      <div id="summary" class="card"></div>
      <div class="chart-container">
        <canvas id="regionChart"></canvas>
      </div>
    </section>

    <section id="recommend">
      <div class="card">
        <h2>Rekomendasi Tanaman</h2>

        <div class="form-row">
          <label>Bulan:</label>
          <select id="month">
            <option>Januari</option><option>Februari</option><option>Maret</option>
            <option>April</option><option>Mei</option><option>Juni</option>
            <option>Juli</option><option>Agustus</option><option>September</option>
            <option>Oktober</option><option>November</option><option>Desember</option>
          </select>

          <label>Musim:</label>
          <select id="season">
            <option value="">(Otomatis)</option>
            <option>Hujan</option><option>Peralihan</option><option>Kemarau</option>
          </select>

          <label>Wilayah:</label>
          <select id="region">
            <option>Jember Utara</option>
            <option>Jember Tengah</option>
            <option>Jember Selatan</option>
          </select>
        </div>

        <div id="result"></div>
        <div class="chart-container">
          <canvas id="recommendChart"></canvas>
        </div>
      </div>
    </section>

    <section id="care">
      <div class="card">
        <h2>Panduan Perawatan</h2>
        <input type="text" id="careSearch" placeholder="Cari Panduan Penananaman (misal: padi, cabai)..." />
        <div id="careResult"></div>
      </div>
    </section>

    <section id="production">
      <div class="card">
        <h2>Data Produksi</h2>
        <div id="productionResult"></div>
        <div class="chart-container">
          <canvas id="productionChart"></canvas>
        </div>
      </div>
    </section>

    <section id="fertilizer">
      <div class="card">
        <h2>Rekomendasi Pupuk</h2>
        <input type="text" id="fertilizerSearch" placeholder="Cari nama tanaman (misal: padi, cabai)..." />
        <div id="fertilizerResult"></div>
      </div>
    </section>

    <section id="analysis">
      <div class="card">
        <h2>Analisis Wilayah</h2>
        <div id="analysisResult"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 AgroSmart Jember | API Rekomendasi Tanaman</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
